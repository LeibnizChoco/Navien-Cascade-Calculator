<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>급탕 캐스케이드 검토 - 방식1</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="min-h-screen flex flex-col">
    <!-- 상단 바 -->
    <header class="bg-sky-900 text-white shadow">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <h1 class="text-base md:text-lg font-semibold">
          급탕 – 순간식 : 세대수 기준
        </h1>
        <a href="dhw.html" class="text-xs underline decoration-dotted">
          ← 급탕 메인
        </a>
      </div>
    </header>

    <main class="flex-1">
      <div class="max-w-5xl mx-auto px-4 py-6 space-y-6">

        <!-- 안내 문구 (method2 스타일) -->
        <p class="text-xs text-slate-500">
          * 본 캐스케이드 계산기는 <span class="font-semibold">현장 간이 검토</span>를 위한 계산기입니다.<br />
          * 정확한 검토가 필요하시면 지사 담당자 / 엔지니어링팀 담당자에게 문의 바랍니다.
        </p>

        <!-- 입력 카드 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6 space-y-5">
          <h2 class="text-sm md:text-base font-semibold">
            ■ 현장정보 / 세대 입력
          </h2>

          <!-- 입력 그리드 -->
          <div class="grid md:grid-cols-2 gap-3">
            <div class="space-y-1">
              <label class="block text-xs font-medium text-slate-700" for="dhwWidth">
                가로폭 (m)
              </label>
              <input
                id="dhwWidth"
                type="number"
                placeholder="예: 40"
                class="w-full rounded-lg border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
              />
            </div>

            <div class="space-y-1">
              <label class="block text-xs font-medium text-slate-700" for="dhwLength">
                세로폭 (m)
              </label>
              <input
                id="dhwLength"
                type="number"
                placeholder="예: 30"
                class="w-full rounded-lg border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
              />
            </div>

            <div class="space-y-1">
              <label class="block text-xs font-medium text-slate-700" for="dhwAboveFloors">
                지상층수
              </label>
              <input
                id="dhwAboveFloors"
                type="number"
                placeholder="예: 10"
                class="w-full rounded-lg border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
              />
            </div>

            <div class="space-y-1">
              <label class="block text-xs font-medium text-slate-700" for="dhwMachineFloor">
                기계실 층
              </label>
              <input
                id="dhwMachineFloor"
                type="number"
                placeholder="예: 1"
                class="w-full rounded-lg border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
              />
            </div>

            <div class="space-y-1">
              <label class="block text-xs font-medium text-slate-700" for="dhwStartFloor">
                입상 시작층
              </label>
              <input
                id="dhwStartFloor"
                type="number"
                placeholder="예: 1"
                class="w-full rounded-lg border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
              />
            </div>

            <div class="space-y-1">
              <label class="block text-xs font-medium text-slate-700" for="dhwBath1">
                욕실1개 세대수
              </label>
              <input
                id="dhwBath1"
                type="number"
                placeholder="예: 20"
                class="w-full rounded-lg border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
              />
            </div>

            <div class="space-y-1">
              <label class="block text-xs font-medium text-slate-700" for="dhwBath2">
                욕실2개 세대수
              </label>
              <input
                id="dhwBath2"
                type="number"
                placeholder="예: 10"
                class="w-full rounded-lg border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
              />
            </div>

            <div class="space-y-1">
              <label class="block text-xs font-medium text-slate-700" for="dhwSim">
                동시사용 수준
              </label>
              <select
                id="dhwSim"
                class="w-full rounded-lg border border-slate-300 px-3 py-1.5 text-xs md:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-sky-500"
              >
                <option>저</option>
                <option>중</option>
                <option>고</option>
              </select>
            </div>
          </div>

          <!-- 버튼 영역 -->
          <div class="pt-3 flex flex-wrap gap-2 justify-between border-t border-dashed border-slate-200">
            <a
              href="dhw.html"
              class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs md:text-sm bg-white hover:bg-slate-50 inline-flex items-center"
            >
              뒤로
            </a>
            <button
              id="dhwCalcBtn"
              type="button"
              class="px-4 py-1.5 rounded-lg bg-sky-600 text-white text-xs md:text-sm font-semibold hover:bg-sky-700"
            >
              계산
            </button>
          </div>
        </section>

        <!-- 결과 카드 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6 space-y-4">
          <h2 class="text-sm md:text-base font-semibold">
            ■ 계산결과
          </h2>

          <div class="space-y-2 text-xs md:text-sm text-slate-800">
            <div class="flex justify-between gap-4">
              <span>급탕부하</span>
              <span id="resLoad" class="font-medium">-</span>
            </div>
            <div class="flex justify-between gap-4">
              <span>캐스케이드 수량</span>
              <span id="resCascadeCount" class="font-medium">-</span>
            </div>
            <div class="flex justify-between gap-4">
              <span>장비용량</span>
              <span id="resCapacity" class="font-medium">-</span>
            </div>
            <div class="flex justify-between gap-4">
              <span>환탕펌프 유량</span>
              <span id="resFlow" class="font-medium">-</span>
            </div>
            <div class="flex justify-between gap-4">
              <span>환탕펌프 양정</span>
              <span id="resHead" class="font-medium">-</span>
            </div>
            <div class="flex justify-between gap-4">
              <span>급탕 주배관</span>
              <span id="resMainPipe" class="font-medium">-</span>
            </div>
            <div class="flex justify-between gap-4">
              <span>환탕 주배관</span>
              <span id="resReturnPipe" class="font-medium">-</span>
            </div>
            <div class="flex justify-between gap-4">
              <span>팽창탱크 용량</span>
              <span id="resTank" class="font-medium">-</span>
            </div>
          </div>
        </section>

      </div>
    </main>

    <script src="dhw-method1.js"></script>
  </div>
</body>
</html>
