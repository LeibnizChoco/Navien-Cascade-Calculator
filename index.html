<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Navien 계산기 - 홈</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: "Pretendard", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue",
        Arial, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="min-h-screen flex flex-col">
    <!-- 상단 바 -->
    <header class="bg-sky-900 text-white shadow">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <h1 class="text-base md:text-lg font-semibold">
          Navien 캐스케이드 계산기
        </h1>
        <span class="text-[11px] opacity-80">Engineering Team</span>
      </div>
    </header>

    <main class="flex-1">
      <div class="max-w-5xl mx-auto px-4 py-6">
        <!-- 메인 카드 -->
        <section
          class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-7 mb-8 text-center space-y-6"
        >
          <div class="space-y-2">
            <h2 class="text-xl md:text-2xl font-bold text-slate-900">
              경동나비엔 캐스케이드 계산기
            </h2>
            <p class="text-xs md:text-sm text-slate-500">
              난방 / 급탕 캐스케이드 설비를 간편하게 검토할 수 있는 계산기입니다.
            </p>
          </div>

          <!-- 버튼들 -->
          <div class="flex flex-col gap-3 text-sm md:text-base">
            <a
              href="heating.html"
              class="w-full inline-flex items-center justify-center px-4 py-2.5 rounded-lg bg-sky-600 text-white font-medium hover:bg-sky-700 transition"
            >
              난방 캐스케이드 검토
            </a>
            <a
              href="dhw.html"
              class="w-full inline-flex items-center justify-center px-4 py-2.5 rounded-lg bg-slate-700 text-white font-medium hover:bg-slate-800 transition"
            >
              급탕 캐스케이드 검토
            </a>
          </div>

          <!-- 안내 문구 -->
          <div class="mt-2 text-[11px] md:text-xs text-slate-500 space-y-1 text-left">
            <p>* 본 캐스케이드 계산기는 현장 간이 검토를 위한 계산기입니다.</p>
            <p>* 정확한 검토가 필요하시면 지사 담당자 / 엔지니어링팀 담당자에게 문의 바랍니다.</p>
          </div>
        </section>

        <!-- 푸터 -->
        <footer class="text-[11px] md:text-xs text-slate-400 text-center">
          ⓒ Kyungdong Navien Engineering Team
        </footer>
      </div>
    </main>
  </div>
</body>
</html>
