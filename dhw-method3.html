<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>급탕 캐스케이드 검토 - 방식3 (기구별 토수량)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="max-w-[700px] mx-auto bg-white rounded-2xl shadow-lg p-6 mt-6 mb-10">
    <h1 class="text-xl font-bold mb-4 text-gray-800">급탕 캐스케이드 검토 - 방식3 (기구별 토수량)</h1>

    <div class="space-y-4">
      <button id="btnAddFixture3" class="bg-gray-200 px-4 py-2 rounded-md hover:bg-gray-300 transition">위생기구 추가</button>
      <div id="containerFixtures3" class="space-y-2"></div>

      <div>
        <label class="block text-sm font-medium mb-1">배관 왕복 길이 (m)</label>
        <input id="etPipeLength" type="number" step="0.1" placeholder="배관왕복길이를 입력하세요"
               class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none">
      </div>

      <div class="flex justify-between mt-6">
        <a href="dhw.html" class="px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition">이전</a>
        <button id="btnMethod3Calculate" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">계산</button>
      </div>

      <button id="btnMethod3Reset" class="mt-4 px-4 py-2 bg-gray-300 rounded-md hover:bg-gray-400 transition">리셋</button>

      <hr class="my-6">

      <h2 class="text-lg font-semibold mb-2">결과</h2>
      <div class="space-y-2 text-sm text-gray-700">
        <div class="flex justify-between"><span>급탕부하</span><span id="tv3EquipmentLoad">-- kcal/h</span></div>
        <div class="flex justify-between"><span>캐스케이드 수량</span><span id="tv3EquipmentCascade">-- 대</span></div>
        <div class="flex justify-between"><span>장비용량</span><span id="tv3EquipmentCapacity">-- kcal/h</span></div>
        <div class="flex justify-between"><span>환탕펌프 유량</span><span id="tv3PumpFlow">-- Lpm</span></div>
        <div class="flex justify-between"><span>환탕펌프 양정</span><span id="tv3PumpHead">-- m</span></div>
        <div class="flex justify-between"><span>팽창탱크 용량</span><span id="tv3TankCapacity">-- L</span></div>
      </div>
    </div>
  </div>

  <script src="dhw-method3.js"></script>
</body>
</html>
